# Defaults shared by every experiment; an experiment config overrides any key.
model_name: microsoft/deberta-v3-base
method: m0                 # m0 = 4-class cross-encoder
train_tracks: [1]
eval_tracks: [1]
max_len: 64                # phrases are short
lr: 2.0e-5
epochs: 5
batch_size: 32
eval_batch_size: 128
grad_accum: 1
warmup_ratio: 0.1
weight_decay: 0.01
keep_model: false          # true when you need the model for test predictions
# Only argmax and self_swap are submission-safe (PLAN.md 2c); the rest look up other rows.
decoders: [argmax, self_swap, joint, joint_structural, graph_soft, graph_hard]
neg_bias: 0.0              # added to the NEG score in self_swap; tune on train OOF, never on dev
temperature: 1.0           # fit on a separate calibration split before test inference
graph_lambda: 1.0          # penalty per violated observed transitivity path
graph_time_limit: 30       # seconds per connected component
